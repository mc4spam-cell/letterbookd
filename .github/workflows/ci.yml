name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: letterbookd
          POSTGRES_USER: letterbookd
          POSTGRES_PASSWORD: letterbookd
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U letterbookd"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://letterbookd:letterbookd@localhost:5432/letterbookd
      DJANGO_SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

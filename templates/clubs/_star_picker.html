{% load i18n %}
<div class="star-picker" role="radiogroup" aria-label="{% translate 'Note' %}">
    {% for h in halves %}
        <input class="star-input" type="radio" name="rating" id="{{ prefix }}-{{ h.value }}"
               value="{{ h.value }}" {% if h.checked %}checked{% endif %}>
        <label for="{{ prefix }}-{{ h.value }}" class="star-half {{ h.side }}"
               aria-label="{{ h.value }}/10"></label>
    {% endfor %}
</div>
<label class="no-rating">
    <input type="radio" name="rating" value="" {% if no_rating %}checked{% endif %}>
    {% translate "pas de note" %}
</label>

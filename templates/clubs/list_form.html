{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Nouvelle liste" %}{% endblock %}
{% block content %}
<h1>{% translate "Nouvelle liste" %}</h1>
<form method="post">{% csrf_token %}
    <p><label>{% translate "Titre" %} <input type="text" name="name" maxlength="120" required></label></p>
    <p><label>{% translate "Description" %}<br><textarea name="description" rows="3" cols="60"></textarea></label></p>
    <button type="submit">{% translate "Créer" %}</button>
</form>
{% endblock %}

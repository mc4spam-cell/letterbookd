{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Créer un groupe de lecture" %}{% endblock %}
{% block content %}
<h1>{% translate "Créer un groupe de lecture" %}</h1>
{% if error %}<p>{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}
    <p><label>{% translate "Nom" %} <input type="text" name="name" value="{{ name|default:'' }}" required></label></p>
    <p><label>{% translate "Description" %}<br><textarea name="description">{{ description|default:'' }}</textarea></label></p>
    <button type="submit">{% translate "Créer" %}</button>
</form>
{% endblock %}
